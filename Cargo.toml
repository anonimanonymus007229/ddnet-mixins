[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
mixins-core = { path = "crates/mixins-core" }
mixins-manifest = { path = "crates/mixins-manifest" }
mixins-lexer = { path = "crates/mixins-lexer" }
mixins-parser = { path = "crates/mixins-parser" }
mixins-transform = { path = "crates/mixins-transform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
